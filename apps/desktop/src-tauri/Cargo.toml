[package]
name = "vibeflow"
version = "1.0.0"
description = "A Cursor-like AI-powered code editor"
authors = ["VibeFlow Team"]
license = "MIT"
repository = "https://github.com/your-username/VibeFlow"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5.0", features = [ "window-unmaximize", "window-unminimize", "window-maximize", "window-close", "window-hide", "fs-all", "http-all", "window-show", "window-start-dragging", "window-minimize", "global-shortcut-all", "shell-open", "dialog-open", "dialog-save"] }
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
uuid = { version = "1.0", features = ["v4"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ] 
